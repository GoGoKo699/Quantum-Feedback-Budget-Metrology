name: Hosted mathematics

on:
  pull_request:
    paths:
      - '.github/workflows/hosted-math.yml'
      - 'verification/hosted_math/**'

permissions:
  contents: read

concurrency:
  group: hosted-math-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CAPTURE_REVISION: '962205f878e63326764f020113109b83139a42bb'
      CAPTURE_MODE: 'probe'
      CAPTURE_PROBE_PAGE: 'science/model.md'
    steps:
      - name: Check out the validation helper source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check out the exact scientific source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CAPTURE_REVISION }}
          path: checked-source
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install the capture runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/math-runtime" playwright@1.56.1 mathjax-full@3.2.1
          node "$RUNNER_TEMP/math-runtime/node_modules/playwright/cli.js" install chromium
      - name: Compare actual hosted mathematics
        run: |
          export NODE_PATH="$RUNNER_TEMP/math-runtime/node_modules"
          args=(
            --root "$GITHUB_WORKSPACE/checked-source"
            --repository "$GITHUB_REPOSITORY"
            --revision "$CAPTURE_REVISION"
          )
          case "$CAPTURE_MODE" in
            probe)
              node verification/hosted_math/probe_hosted_math.cjs "${args[@]}" \
                --page "$CAPTURE_PROBE_PAGE" --output "$RUNNER_TEMP/hosted-math-probe"
              ;;
            full)
              node verification/hosted_math/capture_hosted_math.cjs "${args[@]}" \
                --output "$RUNNER_TEMP/hosted-math-first" || {
                status=$?
                report="$RUNNER_TEMP/hosted-math-first/hosted-report.json"
                if test -f "$report" && grep -Eq 'HTTP (502|503|504)' "$report"; then
                  node verification/hosted_math/capture_hosted_math.cjs "${args[@]}" \
                    --output "$RUNNER_TEMP/hosted-math" \
                    --resume-from "$RUNNER_TEMP/hosted-math-first"
                else
                  exit "$status"
                fi
              }
              ;;
            *)
              echo "CAPTURE_MODE must be probe or full" >&2
              exit 2
              ;;
          esac
      - name: Retain screenshots, reports and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-math-${{ env.CAPTURE_REVISION }}-${{ env.CAPTURE_MODE }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hosted-math-probe
            ${{ runner.temp }}/hosted-math-first
            ${{ runner.temp }}/hosted-math
          if-no-files-found: error
          retention-days: 14
